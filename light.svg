<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hasen Albanna - AI & Machine Learning Engineer banner (light)">
  <defs>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <radialGradient id="glowBlueL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 140) rotate(35) scale(380 260)">
      <stop stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyanL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 120) rotate(20) scale(360 220)">
      <stop stop-color="#06B6D4" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreenL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 500) rotate(-15) scale(340 240)">
      <stop stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="asciiGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
      <animate attributeName="y1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="shadowL" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="blur8L" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="clipCanvasL">
      <rect x="10" y="10" width="1160" height="590" rx="28"/>
    </clipPath>
    <clipPath id="clipAvatarL">
      <circle cx="175" cy="235" r="150"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipCanvasL)">
    <rect width="1180" height="610" fill="url(#bgGradL)"/>
    <rect width="1180" height="610" fill="url(#glowBlueL)"/>
    <rect width="1180" height="610" fill="url(#glowCyanL)"/>
    <rect width="1180" height="610" fill="url(#glowGreenL)"/>

    <rect x="36" y="36" width="1108" height="538" rx="24" fill="#F8FAFC" fill-opacity="0.92" stroke="rgba(15,23,42,0.08)" filter="url(#shadowL)"/>
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentL)" stroke-opacity="0.28"/>
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentL)" stroke-width="1.4" stroke-dasharray="80 120" opacity="0.35">
      <animate attributeName="stroke-dashoffset" values="0;-400" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- LEFT -->
    <g transform="translate(70,70)">
      <rect x="0" y="0" width="350" height="470" rx="20" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)"/>

      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
        <circle cx="175" cy="235" r="152" fill="#F8FAFC" stroke="rgba(15,23,42,0.1)"/>
        <circle cx="175" cy="235" r="150" fill="#E2E8F0"/>

        <g clip-path="url(#clipAvatarL)">
          <image href="https://raw.githubusercontent.com/hasenalbanna/hasenalbanna/main/profile.jpeg" x="25" y="85" width="300" height="300" preserveAspectRatio="xMidYMid slice" opacity="0.95"/>
        </g>

        <rect x="25" y="80" width="300" height="10" fill="#06B6D4" opacity="0.18" filter="url(#blur8L)">
          <animate attributeName="y" values="80;380;80" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="url(#asciiGradL)" opacity="0.8">
        <text x="18" y="420">[ml@hasenalbanna ~]$ train --model transformer</text>
        <text x="18" y="440" opacity="0">
          &gt; compiling features...
          <animate attributeName="opacity" values="0;1;1" dur="2s" begin="0.8s" fill="freeze"/>
        </text>
      </g>
    </g>

    <!-- RIGHT -->
    <g transform="translate(450,70)">
      <rect x="0" y="0" width="660" height="470" rx="20" fill="#FFFFFF" fill-opacity="0.95" stroke="rgba(15,23,42,0.08)"/>

      <circle cx="24" cy="24" r="6" fill="#FB7185"/>
      <circle cx="46" cy="24" r="6" fill="#F59E0B"/>
      <circle cx="68" cy="24" r="6" fill="#34D399"/>

      <text x="28" y="72" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Hi, I'm Hasen Albanna</text>
      <rect x="28" y="84" width="360" height="3" rx="2" fill="url(#accentL)" opacity="0.9"/>

      <g transform="translate(28,118)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="url(#accentL)">
        <text x="0" y="0">AI &amp; Machine Learning Engineer</text>
        <rect x="418" y="-20" width="10" height="26" fill="#06B6D4">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">
        <text x="28" y="170" opacity="0">Location: Earth
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.5s" fill="freeze"/>
        </text>
        <text x="28" y="202" opacity="0">Education: Self-Taught + Continuous Learning
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.9s" fill="freeze"/>
        </text>
        <text x="28" y="234" opacity="0">Current Focus: Applied AI, LLM apps, MLOps
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.3s" fill="freeze"/>
        </text>
        <text x="28" y="266" opacity="0">Portfolio: hasenalbanna.dev
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.7s" fill="freeze"/>
        </text>
        <text x="28" y="298" opacity="0">Email: hello@hasenalbanna.dev
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.1s" fill="freeze"/>
        </text>
      </g>

      <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">
        <g transform="translate(28,334)">
          <rect x="0" y="0" width="78" height="30" rx="15" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5"/>
          <text x="18" y="20">Python</text>
        </g>
        <g transform="translate(116,334)">
          <rect x="0" y="0" width="70" height="30" rx="15" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5"/>
          <text x="14" y="20">PyTorch</text>
        </g>
        <g transform="translate(196,334)">
          <rect x="0" y="0" width="96" height="30" rx="15" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5"/>
          <text x="14" y="20">TensorFlow</text>
        </g>
        <g transform="translate(302,334)">
          <rect x="0" y="0" width="58" height="30" rx="15" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5"/>
          <text x="14" y="20">LLMs</text>
        </g>
      </g>
    </g>
  </g>
</svg>