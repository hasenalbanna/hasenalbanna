<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Hasen Albanna - Premium GitHub Profile Hero (Light)">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Subtle Glow Layers -->
    <radialGradient id="glowBlueL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 140) rotate(35) scale(380 260)">
      <stop stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyanL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 120) rotate(20) scale(360 220)">
      <stop stop-color="#06B6D4" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreenL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 500) rotate(-15) scale(340 240)">
      <stop stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Accent Gradient (Animated) -->
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Text Glow Filter (Softer for light mode) -->
    <filter id="glowTextL" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.2"/>
    </filter>

    <!-- Shadow Filter -->
    <filter id="shadowL" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <!-- Blur Filters -->
    <filter id="blur20L" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blur8L" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="clipCanvasL">
      <rect x="10" y="10" width="1160" height="590" rx="28"/>
    </clipPath>
    <clipPath id="clipProfileL">
      <circle cx="175" cy="245" r="90"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipCanvasL)">
    <!-- Background -->
    <rect width="1180" height="610" fill="url(#bgGradL)"/>
    <rect width="1180" height="610" fill="url(#glowBlueL)"/>
    <rect width="1180" height="610" fill="url(#glowCyanL)"/>
    <rect width="1180" height="610" fill="url(#glowGreenL)"/>

    <!-- Floating Particles -->
    <g opacity="0.3">
      <circle cx="120" cy="80" r="2" fill="#2563EB">
        <animateTransform attributeName="transform" type="translate" values="0 0; 8 14; 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="150" r="1.8" fill="#06B6D4">
        <animateTransform attributeName="transform" type="translate" values="0 0; -10 12; 0 0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="90" r="2" fill="#10B981">
        <animateTransform attributeName="transform" type="translate" values="0 0; 7 10; 0 0" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="500" r="2" fill="#06B6D4">
        <animateTransform attributeName="transform" type="translate" values="0 0; -12 -10; 0 0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main Glass Panel -->
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="#F8FAFC" fill-opacity="0.92" stroke="rgba(15,23,42,0.08)" filter="url(#shadowL)"/>
    
    <!-- Animated Border -->
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentL)" stroke-opacity="0.28" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Border Shimmer -->
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentL)" stroke-width="1.4" stroke-dasharray="80 120" stroke-linecap="round" opacity="0.35">
      <animate attributeName="stroke-dashoffset" values="0;-400" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- LEFT SECTION - PROFILE IMAGE -->
    <g transform="translate(70,70)">
      <rect x="0" y="0" width="350" height="470" rx="20" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)"/>

      <!-- Profile Image Container with Float Animation -->
      <g transform="translate(50,50)">
        <animateTransform attributeName="transform" type="translate" values="50 50; 50 40; 50 50" dur="5s" repeatCount="indefinite"/>
        
        <!-- Glow Circle Background -->
        <circle cx="125" cy="195" r="110" fill="url(#accentL)" opacity="0.1" filter="url(#blur20L)"/>
        <circle cx="125" cy="195" r="100" fill="#F8FAFC" stroke="rgba(15,23,42,0.1)" stroke-width="2"/>
        
        <!-- Profile Image Placeholder with Gradient -->
        <defs>
          <linearGradient id="profileGradL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2563EB"/>
            <stop offset="1" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#clipProfileL)">
          <circle cx="175" cy="245" r="90" fill="url(#profileGradL)" opacity="0.6"/>
          <text x="175" y="250" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#0F172A" text-anchor="middle" opacity="0.7">HA</text>
        </g>

        <!-- Scanline Effect -->
        <rect x="0" y="50" width="250" height="8" fill="#06B6D4" opacity="0.12" filter="url(#blur8L)">
          <animate attributeName="y" values="50;330;50" dur="4.6s" repeatCount="indefinite" begin="2s"/>
        </rect>
      </g>

      <!-- Terminal Code Section -->
      <g transform="translate(20,380)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#2563EB" opacity="0.7" filter="url(#glowTextL)">
        <text x="0" y="0">[developer@hasen ~]$</text>
        <text x="0" y="20" fill="#06B6D4">neural_network.initialize()</text>
        <text x="0" y="40" fill="#10B981">model_confidence: 99.2%</text>
      </g>
    </g>

    <!-- RIGHT SECTION - TERMINAL WINDOW -->
    <g transform="translate(450,70)">
      <rect x="0" y="0" width="660" height="470" rx="20" fill="#FFFFFF" fill-opacity="0.95" stroke="rgba(15,23,42,0.08)"/>

      <!-- Terminal Header -->
      <circle cx="24" cy="24" r="6" fill="#FB7185"/>
      <circle cx="46" cy="24" r="6" fill="#F59E0B"/>
      <circle cx="68" cy="24" r="6" fill="#34D399"/>

      <!-- Greeting -->
      <g transform="translate(28,72)">
        <text x="0" y="0" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Hi 👋, I'm Hasen Albanna</text>
      </g>

      <!-- Animated Underline -->
      <rect x="28" y="94" width="380" height="3" rx="2" fill="url(#accentL)" opacity="0.9">
        <animate attributeName="width" values="0;380" dur="0.8s" begin="0.5s" fill="freeze"/>
      </rect>

      <!-- Typing Role Animation -->
      <g transform="translate(28,138)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="url(#accentL)" filter="url(#glowTextL)">
        <text x="0" y="0" opacity="0">Frontend Engineer<animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/></text>
        <text x="0" y="0" opacity="0">Full Stack Developer<animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.5s"/><animate attributeName="opacity" values="1;0" dur="0.6s" begin="3.5s"/></text>
        <text x="0" y="0" opacity="0">AI Enthusiast<animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.5s"/><animate attributeName="opacity" values="1;0" dur="0.6s" begin="5.5s"/></text>

        <!-- Blinking Cursor -->
        <rect x="400" y="-18" width="10" height="28" fill="#06B6D4">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="1.5s"/>
        </rect>
      </g>

      <!-- Info Section - Sequential Reveal -->
      <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">
        <text x="28" y="210" opacity="0">📍 Location: Earth
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="2s" fill="freeze"/>
        </text>
        <text x="28" y="245" opacity="0">🎓 Education: Self-Taught + Continuous Learning
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.7s" fill="freeze"/>
        </text>
        <text x="28" y="280" opacity="0">🚀 Current Focus: Applied AI, LLM apps, MLOps
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="3.4s" fill="freeze"/>
        </text>
        <text x="28" y="315" opacity="0">💼 Portfolio: hasenalbanna.dev
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="4.1s" fill="freeze"/>
        </text>
        <text x="28" y="350" opacity="0">📧 Email: hello@hasenalbanna.dev
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="4.8s" fill="freeze"/>
        </text>
      </g>

      <!-- Skills Glowing Pills -->
      <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">
        <g transform="translate(28,375)" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.5s" fill="freeze"/>
          <rect x="0" y="0" width="86" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="1.5"/>
          <text x="15" y="24">Python</text>
        </g>
        <g transform="translate(124,375)" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.9s" fill="freeze"/>
          <rect x="0" y="0" width="86" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="1.5"/>
          <text x="12" y="24">PyTorch</text>
        </g>
        <g transform="translate(220,375)" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="6.3s" fill="freeze"/>
          <rect x="0" y="0" width="105" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="1.5"/>
          <text x="15" y="24">TensorFlow</text>
        </g>
        <g transform="translate(335,375)" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="6.7s" fill="freeze"/>
          <rect x="0" y="0" width="58" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="1.5"/>
          <text x="12" y="24">LLMs</text>
        </g>
        <g transform="translate(403,375)" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="7.1s" fill="freeze"/>
          <rect x="0" y="0" width="80" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="1.5"/>
          <text x="15" y="24">MLOps</text>
        </g>
      </g>

      <!-- Social Icons -->
      <g transform="translate(28,430)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="7.8s" fill="freeze"/>
        <!-- GitHub -->
        <g transform="translate(0,0)">
          <circle cx="16" cy="16" r="14" fill="none" stroke="url(#accentL)" stroke-width="1.5" opacity="0.6"/>
          <text x="10" y="20" font-size="12" fill="url(#accentL)">⚙</text>
        </g>
        <!-- LinkedIn -->
        <g transform="translate(50,0)">
          <circle cx="16" cy="16" r="14" fill="none" stroke="url(#accentL)" stroke-width="1.5" opacity="0.6"/>
          <text x="10" y="20" font-size="12" fill="url(#accentL)">⚙</text>
        </g>
        <!-- Twitter -->
        <g transform="translate(100,0)">
          <circle cx="16" cy="16" r="14" fill="none" stroke="url(#accentL)" stroke-width="1.5" opacity="0.6"/>
          <text x="10" y="20" font-size="12" fill="url(#accentL)">⚙</text>
        </g>
        <!-- Portfolio -->
        <g transform="translate(150,0)">
          <circle cx="16" cy="16" r="14" fill="none" stroke="url(#accentL)" stroke-width="1.5" opacity="0.6"/>
          <text x="10" y="20" font-size="12" fill="url(#accentL)">⚙</text>
        </g>
      </g>
    </g>
  </g>
</svg>