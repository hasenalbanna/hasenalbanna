<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hasen Albanna - Premium Profile Card (Light)">
  <defs>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <radialGradient id="glowBlueL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 140) rotate(35) scale(380 260)">
      <stop stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyanL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 120) rotate(20) scale(360 220)">
      <stop stop-color="#06B6D4" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreenL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 500) rotate(-15) scale(340 240)">
      <stop stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="shadowL" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="blur8L" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur20L" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <clipPath id="clipCanvasL">
      <rect x="10" y="10" width="1160" height="590" rx="28"/>
    </clipPath>
    <clipPath id="clipAvatarL">
      <circle cx="230" cy="305" r="150"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipCanvasL)">
    <rect width="1180" height="610" fill="url(#bgGradL)"/>
    <rect width="1180" height="610" fill="url(#glowBlueL)"/>
    <rect width="1180" height="610" fill="url(#glowCyanL)"/>
    <rect width="1180" height="610" fill="url(#glowGreenL)"/>

    <rect x="36" y="36" width="1108" height="538" rx="24" fill="#F8FAFC" fill-opacity="0.92" stroke="rgba(15,23,42,0.08)" filter="url(#shadowL)"/>
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentL)" stroke-opacity="0.28"/>
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentL)" stroke-width="1.4" stroke-dasharray="80 120" opacity="0.35">
      <animate attributeName="stroke-dashoffset" values="0;-400" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Profile Card Section -->
    <g transform="translate(70,70)">
      <rect x="0" y="0" width="1040" height="470" rx="20" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)"/>

      <!-- Photo Container -->
      <g transform="translate(40,40)">
        <animateTransform attributeName="transform" type="translate" values="40 40; 40 34; 40 40" dur="5s" repeatCount="indefinite"/>
        <circle cx="150" cy="195" r="152" fill="#F8FAFC" stroke="rgba(15,23,42,0.1)"/>
        <circle cx="150" cy="195" r="150" fill="#E2E8F0"/>

        <!-- USER PHOTO -->
        <g clip-path="url(#clipAvatarL)">
          <image href="https://raw.githubusercontent.com/hasenalbanna/hasenalbanna/main/profile.jpeg" x="80" y="155" width="300" height="300" preserveAspectRatio="xMidYMid slice" opacity="0.95"/>
        </g>

        <!-- Scanline effect -->
        <rect x="0" y="40" width="300" height="10" fill="#06B6D4" opacity="0.18" filter="url(#blur8L)">
          <animate attributeName="y" values="40;340;40" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Text Content -->
      <g transform="translate(400,60)">
        <text x="0" y="0" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Hasen Albanna</text>
        <rect x="0" y="20" width="400" height="4" rx="2" fill="url(#accentL)" opacity="0.9"/>
        
        <text x="0" y="70" fill="url(#accentL)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="600">AI &amp; ML Engineer</text>
        
        <text x="0" y="130" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Passionate about</text>
        <text x="0" y="160" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Machine Learning, Computer Vision &amp;</text>
        <text x="0" y="190" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Full Stack Development</text>

        <!-- Skills pills -->
        <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#0F172A">
          <g transform="translate(0,240)">
            <rect x="0" y="0" width="90" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="2"/>
            <text x="18" y="24">Python</text>
          </g>
          <g transform="translate(110,240)">
            <rect x="0" y="0" width="90" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="2"/>
            <text x="14" y="24">PyTorch</text>
          </g>
          <g transform="translate(220,240)">
            <rect x="0" y="0" width="110" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="2"/>
            <text x="18" y="24">TensorFlow</text>
          </g>
          <g transform="translate(350,240)">
            <rect x="0" y="0" width="70" height="36" rx="18" fill="#F8FAFC" stroke="url(#accentL)" stroke-opacity="0.5" stroke-width="2"/>
            <text x="12" y="24">LLMs</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>