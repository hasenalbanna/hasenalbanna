<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hasen Albanna - AI & Machine Learning Engineer banner (dark)">
  <defs>
    <linearGradient id="bgGradD" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowBlueD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 140) rotate(35) scale(380 260)">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurpleD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 120) rotate(20) scale(360 220)">
      <stop stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmeraldD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 500) rotate(-15) scale(340 240)">
      <stop stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="asciiGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="y1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="blur20" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadowD" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowTextD" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22D3EE" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>

    <clipPath id="clipCanvasD">
      <rect x="10" y="10" width="1160" height="590" rx="28"/>
    </clipPath>
    <clipPath id="clipAvatarD">
      <circle cx="230" cy="305" r="150"/>
    </clipPath>

    <mask id="scanMaskD">
      <rect x="0" y="0" width="1180" height="610" fill="white"/>
      <rect x="0" y="0" width="1180" height="610" fill="url(#scanPatternD)" opacity="0.25"/>
    </mask>

    <linearGradient id="scanPatternD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clipCanvasD)">
    <rect width="1180" height="610" fill="url(#bgGradD)"/>
    <rect width="1180" height="610" fill="url(#glowBlueD)"/>
    <rect width="1180" height="610" fill="url(#glowPurpleD)"/>
    <rect width="1180" height="610" fill="url(#glowEmeraldD)"/>

    <!-- Floating particles -->
    <g opacity="0.5">
      <circle cx="120" cy="80" r="2" fill="#67E8F9">
        <animateTransform attributeName="transform" type="translate" values="0 0; 8 14; 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="150" r="1.8" fill="#A78BFA">
        <animateTransform attributeName="transform" type="translate" values="0 0; -10 12; 0 0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="90" r="2" fill="#34D399">
        <animateTransform attributeName="transform" type="translate" values="0 0; 7 10; 0 0" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="500" r="2" fill="#67E8F9">
        <animateTransform attributeName="transform" type="translate" values="0 0; -12 -10; 0 0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main glass panel -->
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="#0F172A" fill-opacity="0.72" stroke="rgba(255,255,255,0.08)" filter="url(#shadowD)"/>
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentD)" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.2;0.45;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Border shimmer -->
    <rect x="36" y="36" width="1108" height="538" rx="24" fill="none" stroke="url(#accentD)" stroke-width="1.5" stroke-dasharray="80 120" stroke-linecap="round" opacity="0.45">
      <animate attributeName="stroke-dashoffset" values="0;-400" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Left section -->
    <g transform="translate(70,70)">
      <rect x="0" y="0" width="350" height="470" rx="20" fill="#0B1220" fill-opacity="0.88" stroke="rgba(255,255,255,0.07)"/>

      <g transform="translate(0,0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
        <circle cx="175" cy="235" r="164" fill="url(#accentD)" opacity="0.15" filter="url(#blur20)"/>
        <circle cx="175" cy="235" r="152" fill="#020617" stroke="rgba(255,255,255,0.08)"/>
        <circle cx="175" cy="235" r="150" fill="#0F172A"/>

        <!-- USER PHOTO PLACEHOLDER -->
        <!-- Replace href with your hosted image URL if needed -->
        <g clip-path="url(#clipAvatarD)">
          <image href="https://raw.githubusercontent.com/hasenalbanna/hasenalbanna/main/profile.jpeg" x="80" y="155" width="300" height="300" preserveAspectRatio="xMidYMid slice" opacity="0.92"/>
        </g>

        <!-- scanline -->
        <rect x="25" y="80" width="300" height="12" fill="#22D3EE" opacity="0.15" filter="url(#blur8)">
          <animate attributeName="y" values="80;380;80" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- pseudo terminal ascii accent -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="url(#asciiGradD)" opacity="0.72" filter="url(#glowTextD)">
        <text x="18" y="420">[ai@hasenalbanna ~]$ initialize_profile --ml --vision</text>
        <text x="18" y="440" opacity="0">
          &gt; loading neural identity...
          <animate attributeName="opacity" values="0;1;1" dur="2s" begin="0.8s" fill="freeze"/>
        </text>
        <text x="18" y="458" opacity="0">
          &gt; model confidence: 99.2%
          <animate attributeName="opacity" values="0;1;1" dur="2s" begin="1.4s" fill="freeze"/>
        </text>
      </g>
    </g>

    <!-- Right terminal -->
    <g transform="translate(450,70)">
      <rect x="0" y="0" width="660" height="470" rx="20" fill="#0B1220" fill-opacity="0.86" stroke="rgba(255,255,255,0.08)"/>

      <circle cx="24" cy="24" r="6" fill="#FB7185"/>
      <circle cx="46" cy="24" r="6" fill="#F59E0B"/>
      <circle cx="68" cy="24" r="6" fill="#34D399"/>

      <text x="28" y="72" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Hi, I'm Hasen Albanna</text>
      <rect x="28" y="84" width="360" height="3" rx="2" fill="url(#accentD)" opacity="0.8"/>

      <!-- role typing line -->
      <g transform="translate(28,118)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="url(#accentD)">
        <text x="0" y="0">AI &amp; Machine Learning Engineer</text>
        <rect x="418" y="-20" width="10" height="26" fill="#22D3EE">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#94A3B8">
        <text x="28" y="170" opacity="0">Location: Earth
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.5s" fill="freeze"/>
        </text>
        <text x="28" y="202" opacity="0">Education: Self-Taught + Continuous Learning
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.9s" fill="freeze"/>
        </text>
        <text x="28" y="234" opacity="0">Current Focus: Applied AI, LLM apps, MLOps
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.3s" fill="freeze"/>
        </text>
        <text x="28" y="266" opacity="0">Portfolio: hasenalbanna.dev
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.7s" fill="freeze"/>
        </text>
        <text x="28" y="298" opacity="0">Email: hello@hasenalbanna.dev
          <animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.1s" fill="freeze"/>
        </text>
      </g>

      <!-- skills pills -->
      <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#E2E8F0">
        <g transform="translate(28,334)">
          <rect x="0" y="0" width="78" height="30" rx="15" fill="#111827" stroke="url(#accentD)" stroke-opacity="0.45"/>
          <text x="18" y="20">Python</text>
        </g>
        <g transform="translate(116,334)">
          <rect x="0" y="0" width="70" height="30" rx="15" fill="#111827" stroke="url(#accentD)" stroke-opacity="0.45"/>
          <text x="14" y="20">PyTorch</text>
        </g>
        <g transform="translate(196,334)">
          <rect x="0" y="0" width="60" height="30" rx="15" fill="#111827" stroke="url(#accentD)" stroke-opacity="0.45"/>
          <text x="15" y="20">TensorFlow</text>
        </g>
        <g transform="translate(266,334)">
          <rect x="0" y="0" width="58" height="30" rx="15" fill="#111827" stroke="url(#accentD)" stroke-opacity="0.45"/>
          <text x="14" y="20">LLMs</text>
        </g>
        <g transform="translate(334,334)">
          <rect x="0" y="0" width="64" height="30" rx="15" fill="#111827" stroke="url(#accentD)" stroke-opacity="0.45"/>
          <text x="17" y="20">MLOps</text>
        </g>
      </g>
    </g>
  </g>
</svg>